name: MindHue CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==============================================================================
  # Job 1: Django Backend Tests & System Verification
  # ==============================================================================
  backend-ci:
    name: Backend CI (Django 4.2 / Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Checks
        env:
          DJANGO_SECRET_KEY: test-key-ci-cd-mindhue-2026
          DJANGO_DEBUG: "True"
        run: |
          python backend/manage.py check

      - name: Collect Static Files
        env:
          DJANGO_SECRET_KEY: test-key-ci-cd-mindhue-2026
        run: |
          python backend/manage.py collectstatic --no-input

      - name: Run Backend Unit Tests
        env:
          DJANGO_SECRET_KEY: test-key-ci-cd-mindhue-2026
          DJANGO_DEBUG: "True"
        run: |
          python backend/manage.py test api

  # ==============================================================================
  # Job 2: React Frontend Build & Asset Verification
  # ==============================================================================
  frontend-ci:
    name: Frontend CI (Node 20 / Vite / React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Build Production Frontend Bundle
        working-directory: ./frontend
        run: |
          npm run build

  # ==============================================================================
  # Job 3: Docker Multi-Container Build Verification
  # ==============================================================================
  docker-ci:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: mindhue-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: mindhue-frontend:ci

  # ==============================================================================
  # Job 4: Automated Deployment Triggers (Vercel & Render)
  # ==============================================================================
  deploy:
    name: Production Deployment (Vercel & Render)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Trigger Render Deployment via Deploy Hook URL (if configured in secrets)
      - name: Trigger Render Backend Deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "🚀 Triggering Render Web Service Deploy Hook..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "✅ Render deployment initiated."

      # Trigger Vercel Deployment (if configured in secrets)
      - name: Deploy Frontend to Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
